spring:
  datasource:
    url: jdbc:h2:mem:huntos;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:default-key}

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:default-key}

  mail:
    host: smtp.sendgrid.net
    port: 587
    username: apikey
    password: ${SENDGRID_API_KEY:default-key}
  data:
    redis:
      host: localhost
      port: 6379

serpapi:
  key: ${SERPAPI_KEY:default-key}

scheduler:
  digest:
    cron: "0 0 7 * * *"
